services:
  postgres:
    # Bundles TimescaleDB + PostGIS (same Postgres 17 base as `postgres:17`).
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: soundwatch
      POSTGRES_PASSWORD: soundwatch
      POSTGRES_DB: soundwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf

volumes:
  pgdata:
