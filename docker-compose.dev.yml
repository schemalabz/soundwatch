services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: soundwatch
      POSTGRES_PASSWORD: soundwatch
      POSTGRES_DB: soundwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf

volumes:
  pgdata:
