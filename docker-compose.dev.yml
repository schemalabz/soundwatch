services:
  postgres:
    # TimescaleDB-capable, drop-in for postgres:17 (same data dir). Used with
    # PLAIN Postgres usage for now — no hypertables/continuous aggregates yet
    # (Step 6). timescaledb extension is available but not activated.
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: soundwatch
      POSTGRES_PASSWORD: soundwatch
      POSTGRES_DB: soundwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf

volumes:
  pgdata:
