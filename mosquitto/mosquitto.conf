# Per-listener security, so the device listener and the internal one differ.
per_listener_settings true

# ---------------------------------------------------------------------------
# Device listener — PLAINTEXT, published to the internet.
#
# Plaintext is a constraint, not a preference: the ESP8266 firmware uses a plain
# WiFiClient (esp/src/SckESP.cpp), not WiFiClientSecure, so it cannot do TLS at
# all. It also sends no username/password — the MQTT client-id IS the device
# token (the stock SmartCitizen model).
#
# Security is therefore per-device topic isolation, enforced by the ACL: a
# device can publish its own readings and receive its own commands, but cannot
# read another device's data or forge readings as another device. Note this is
# containment, NOT confidentiality — traffic is unencrypted, so anyone on the
# network path can read it. Real confidentiality needs TLS, which needs firmware
# work (WiFiClientSecure + cert storage on a chip with ~40KB of heap).
#
# The previous TLS listener on 8883 is removed: no device could ever use it, so
# it was security theatre while 1883 sat open. Reinstate it when the firmware
# can actually speak TLS.
# ---------------------------------------------------------------------------
listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl

# ---------------------------------------------------------------------------
# Backend listener — deliberately NOT published in docker-compose, so it is
# reachable only from inside the compose network.
#
# The ingester needs a wildcard subscription (device/sck/+/readings/raw) which
# the device ACL forbids by design. Giving backend services their own unexposed
# listener avoids inventing broker credentials for them.
# ---------------------------------------------------------------------------
listener 1884
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
