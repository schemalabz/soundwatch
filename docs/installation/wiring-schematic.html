<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soundwatch Athens - Wiring Schematic</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { text-align: center; font-size: 20px; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
  svg { display: block; margin: 0 auto; }
  .print-btn {
    display: block;
    margin: 15px auto;
    padding: 8px 20px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .print-btn:hover { background: #555; }
  @media print {
    .print-btn { display: none; }
    body { padding: 0; }
  }
</style>
</head>
<body>
<div class="container">
<h1>Soundwatch Athens - Wiring Schematic</h1>
<p class="subtitle">Per-sensor installation | 230V AC junction box (klema) &rarr; MeanWell IRM-10-5 (5V/2A) &rarr; Smart Citizen Kit 2.3</p>

<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" style="max-width:1100px; width:100%;">
  <defs>
    <!-- Arrowhead -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <!-- Wire junction dot -->
    <circle id="junction" r="4" fill="#333"/>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="#fafafa" rx="8"/>

  <!-- =============================== -->
  <!-- POWER BOX enclosure (dashed)    -->
  <!-- =============================== -->
  <rect x="40" y="50" width="620" height="420" rx="10" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="350" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#555">POWER BOX</text>
  <text x="350" y="485" text-anchor="middle" font-size="10" fill="#999">Inside existing junction box (kouti klemas)</text>

  <!-- =============================== -->
  <!-- KLEMA (junction box terminal)   -->
  <!-- =============================== -->
  <g transform="translate(70, 140)">
    <!-- Terminal block body -->
    <rect x="0" y="0" width="100" height="180" rx="6" fill="#F5F5F5" stroke="#666" stroke-width="2.5"/>
    <!-- Title -->
    <text x="50" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#444">KLEMA</text>
    <text x="50" y="0" text-anchor="middle" font-size="9" fill="#888">230V AC</text>

    <!-- L terminal -->
    <rect x="10" y="25" width="80" height="45" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="50" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#E65100">L (fasi)</text>
    <text x="50" y="58" text-anchor="middle" font-size="9" fill="#BF360C">230V Live</text>
    <!-- L output dot -->
    <circle cx="100" cy="47" r="4" fill="#8B4513"/>

    <!-- N terminal -->
    <rect x="10" y="100" width="80" height="45" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="50" y="117" text-anchor="middle" font-size="10" font-weight="700" fill="#1565C0">N (oudeteros)</text>
    <text x="50" y="133" text-anchor="middle" font-size="9" fill="#0D47A1">Neutral</text>
    <!-- N output dot -->
    <circle cx="100" cy="122" r="4" fill="#2980b9"/>
  </g>

  <!-- =============================== -->
  <!-- FUSE HOLDER (inline on L)       -->
  <!-- =============================== -->

  <!-- L wire from klema to fuse -->
  <line x1="174" y1="187" x2="250" y2="187" stroke="#8B4513" stroke-width="2.5"/>
  <text x="195" y="178" font-size="9" font-weight="600" fill="#8B4513">L (Brown)</text>

  <!-- Fuse holder -->
  <g transform="translate(250, 163)">
    <rect x="0" y="0" width="110" height="48" rx="6" fill="#FFF8E1" stroke="#F57F17" stroke-width="2"/>
    <text x="55" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#F57F17">FUSE HOLDER</text>
    <text x="55" y="30" text-anchor="middle" font-size="10" font-weight="600" fill="#E65100">1.6A / 5x20mm</text>
    <text x="55" y="42" text-anchor="middle" font-size="8" fill="#999">BLX-4</text>
    <!-- Fuse symbol inside -->
    <line x1="-4" y1="24" x2="0" y2="24" stroke="#8B4513" stroke-width="2.5"/>
    <circle cx="0" cy="24" r="3" fill="#8B4513"/>
    <circle cx="110" cy="24" r="3" fill="#8B4513"/>
    <line x1="110" y1="24" x2="114" y2="24" stroke="#8B4513" stroke-width="2.5"/>
  </g>

  <!-- L wire from fuse to IRM-10-5 -->
  <line x1="364" y1="187" x2="440" y2="187" stroke="#8B4513" stroke-width="2.5"/>

  <!-- =============================== -->
  <!-- N wire (straight to IRM-10-5)   -->
  <!-- =============================== -->
  <line x1="174" y1="262" x2="440" y2="262" stroke="#2980b9" stroke-width="2.5"/>
  <text x="260" y="253" font-size="9" font-weight="600" fill="#2980b9">N (Blue)</text>

  <!-- =============================== -->
  <!-- IRM-10-5 AC-DC CONVERTER        -->
  <!-- =============================== -->
  <g transform="translate(440, 140)">
    <!-- Module body -->
    <rect x="0" y="0" width="180" height="170" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>

    <!-- Title -->
    <text x="90" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">MeanWell IRM-10-5</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#388E3C">AC-DC Converter</text>
    <text x="90" y="52" text-anchor="middle" font-size="9" fill="#666">230V AC &rarr; 5V DC / 2A / 10W</text>

    <!-- Divider line -->
    <line x1="90" y1="62" x2="90" y2="155" stroke="#A5D6A7" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="45" y="72" text-anchor="middle" font-size="8" font-weight="600" fill="#C62828">AC INPUT</text>
    <text x="135" y="72" text-anchor="middle" font-size="8" font-weight="600" fill="#1565C0">DC OUTPUT</text>

    <!-- AC/L pin -->
    <rect x="8" y="82" width="65" height="28" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="40" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#E65100">AC/L</text>
    <circle cx="0" cy="96" r="4" fill="#8B4513"/>

    <!-- AC/N pin -->
    <rect x="8" y="120" width="65" height="28" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="40" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="#1565C0">AC/N</text>
    <circle cx="0" cy="134" r="4" fill="#2980b9"/>

    <!-- +V pin -->
    <rect x="107" y="82" width="65" height="28" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
    <text x="139" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#C62828">+V (5V)</text>
    <circle cx="180" cy="96" r="4" fill="#e74c3c"/>

    <!-- -V pin -->
    <rect x="107" y="120" width="65" height="28" rx="4" fill="#ECEFF1" stroke="#37474F" stroke-width="1.5"/>
    <text x="139" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="#37474F">-V (GND)</text>
    <circle cx="180" cy="134" r="4" fill="#333"/>
  </g>

  <!-- Wire from L to AC/L -->
  <line x1="436" y1="187" x2="440" y2="236" stroke="#8B4513" stroke-width="2.5"/>

  <!-- Wire from N to AC/N -->
  <line x1="436" y1="262" x2="440" y2="274" stroke="#2980b9" stroke-width="2.5"/>

  <!-- =============================== -->
  <!-- DC OUTPUT WIRES                 -->
  <!-- =============================== -->

  <!-- +V (Red) wire to cable gland -->
  <line x1="620" y1="236" x2="700" y2="236" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="640" y="228" font-size="9" font-weight="600" fill="#e74c3c">+5V (Red)</text>

  <!-- -V (Black) wire to cable gland -->
  <line x1="620" y1="274" x2="700" y2="274" stroke="#333" stroke-width="2.5"/>
  <text x="640" y="290" font-size="9" font-weight="600" fill="#333">GND (Black)</text>

  <!-- =============================== -->
  <!-- CABLE GLAND                     -->
  <!-- =============================== -->
  <g transform="translate(700, 215)">
    <!-- Gland body -->
    <rect x="0" y="0" width="50" height="80" rx="25" fill="#E0E0E0" stroke="#757575" stroke-width="2.5"/>
    <text x="25" y="35" text-anchor="middle" font-size="8" font-weight="700" fill="#555">CABLE</text>
    <text x="25" y="47" text-anchor="middle" font-size="8" font-weight="700" fill="#555">GLAND</text>
    <text x="25" y="60" text-anchor="middle" font-size="7" fill="#888">M12</text>
    <!-- Wire pass-throughs -->
    <circle cx="25" cy="21" r="3" fill="#e74c3c"/>
    <circle cx="25" cy="59" r="3" fill="#333"/>
  </g>

  <!-- =============================== -->
  <!-- USB CABLE (between boxes)       -->
  <!-- =============================== -->

  <!-- Cable lines from gland to sensor box -->
  <line x1="750" y1="236" x2="810" y2="236" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="750" y1="274" x2="810" y2="274" stroke="#333" stroke-width="2.5"/>

  <!-- Cable label -->
  <text x="780" y="218" text-anchor="middle" font-size="9" fill="#888">USB cable</text>
  <text x="780" y="208" text-anchor="middle" font-size="8" fill="#aaa">(USB-A end cut off)</text>

  <!-- Crossed-out data wires indication -->
  <g transform="translate(762, 249)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="0" y1="7" x2="35" y2="7" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="5" y1="-4" x2="30" y2="12" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="40" y="6" font-size="7" fill="#bbb">D+/D- unused</text>
  </g>

  <!-- =============================== -->
  <!-- SENSOR BOX enclosure (dashed)   -->
  <!-- =============================== -->
  <rect x="800" y="50" width="270" height="420" rx="10" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="935" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#555">SENSOR BOX</text>
  <text x="935" y="485" text-anchor="middle" font-size="10" fill="#999">Separate enclosure (ventilated)</text>

  <!-- =============================== -->
  <!-- MICRO USB CONNECTOR             -->
  <!-- =============================== -->
  <g transform="translate(825, 225)">
    <rect x="0" y="0" width="70" height="60" rx="5" fill="#F5F5F5" stroke="#666" stroke-width="2"/>
    <text x="35" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#555">MICRO USB</text>
    <text x="35" y="30" text-anchor="middle" font-size="8" fill="#888">Connector</text>
    <!-- Micro USB trapezoid shape -->
    <path d="M15,38 L55,38 L50,52 L20,52 Z" fill="none" stroke="#999" stroke-width="1.5"/>
    <text x="35" y="48" text-anchor="middle" font-size="7" fill="#999">plug</text>
    <!-- Input dots -->
    <circle cx="0" cy="15" r="3" fill="#e74c3c"/>
    <circle cx="0" cy="45" r="3" fill="#333"/>
  </g>

  <!-- Wires into micro USB -->
  <line x1="810" y1="236" x2="825" y2="240" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="810" y1="274" x2="825" y2="270" stroke="#333" stroke-width="2.5"/>

  <!-- =============================== -->
  <!-- SMART CITIZEN KIT 2.3           -->
  <!-- =============================== -->
  <g transform="translate(840, 110)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1565C0">Smart Citizen Kit 2.3</text>
    <text x="100" y="38" text-anchor="middle" font-size="9" fill="#1976D2">Urban Board + SEN5X PM sensor</text>
    <text x="100" y="52" text-anchor="middle" font-size="9" fill="#666">MEMS mic (ICS-43432)</text>
    <text x="100" y="66" text-anchor="middle" font-size="8" fill="#888">WiFi &rarr; MQTT &rarr; Soundwatch</text>
    <!-- USB input indicator -->
    <line x1="60" y1="80" x2="60" y2="100" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="60" y="108" text-anchor="middle" font-size="7" fill="#aaa">micro USB power in</text>
  </g>

  <!-- Connection from USB connector to SCK -->
  <line x1="860" y1="225" x2="900" y2="190" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- =============================== -->
  <!-- LiPo BATTERY                    -->
  <!-- =============================== -->
  <g transform="translate(860, 330)">
    <rect x="0" y="0" width="160" height="55" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
    <!-- Battery symbol -->
    <line x1="18" y1="20" x2="18" y2="40" stroke="#F9A825" stroke-width="3"/>
    <line x1="28" y1="25" x2="28" y2="35" stroke="#F9A825" stroke-width="2"/>
    <text x="95" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#F57F17">LiPo Battery</text>
    <text x="95" y="36" text-anchor="middle" font-size="9" fill="#F9A825">2000mAh (included)</text>
    <text x="95" y="48" text-anchor="middle" font-size="8" fill="#999">Acts as UPS backup</text>
  </g>

  <!-- Battery connection to SCK -->
  <line x1="940" y1="330" x2="940" y2="190" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="950" y="260" font-size="7" fill="#F9A825" transform="rotate(90, 950, 260)">JST connector</text>

  <!-- =============================== -->
  <!-- SOLDER POINTS INDICATORS        -->
  <!-- =============================== -->

  <!-- Solder point: AC/L -->
  <g transform="translate(428, 220)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FF6F00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FF6F00"/>
    <text x="-20" y="18" font-size="7" fill="#FF6F00">solder</text>
  </g>

  <!-- Solder point: AC/N -->
  <g transform="translate(428, 258)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FF6F00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FF6F00"/>
    <text x="-20" y="18" font-size="7" fill="#FF6F00">solder</text>
  </g>

  <!-- Solder point: +V -->
  <g transform="translate(632, 222)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FF6F00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FF6F00"/>
    <text x="10" y="4" font-size="7" fill="#FF6F00">solder</text>
  </g>

  <!-- Solder point: -V -->
  <g transform="translate(632, 288)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FF6F00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FF6F00"/>
    <text x="10" y="4" font-size="7" fill="#FF6F00">solder</text>
  </g>

  <!-- =============================== -->
  <!-- HEAT SHRINK INDICATORS          -->
  <!-- =============================== -->
  <g transform="translate(408, 200)">
    <rect x="0" y="0" width="16" height="8" rx="4" fill="none" stroke="#FF6F00" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  <g transform="translate(408, 264)">
    <rect x="0" y="0" width="16" height="8" rx="4" fill="none" stroke="#FF6F00" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- =============================== -->
  <!-- IRM-10-5 PIN LAYOUT (DETAIL)    -->
  <!-- =============================== -->
  <g transform="translate(440, 400)">
    <rect x="0" y="0" width="180" height="55" rx="5" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="90" y="14" text-anchor="middle" font-size="8" font-weight="600" fill="#666">IRM-10-5 PIN LAYOUT (Bottom View)</text>
    <text x="25" y="35" text-anchor="middle" font-size="9" font-weight="600" fill="#E65100">AC/L</text>
    <circle cx="25" cy="42" r="4" fill="#E65100"/>
    <text x="25" y="53" text-anchor="middle" font-size="9" font-weight="600" fill="#1565C0">AC/N</text>
    <!-- Arrow between -->
    <text x="90" y="42" text-anchor="middle" font-size="8" fill="#ccc">&#x2190; AC | DC &#x2192;</text>
    <text x="155" y="35" text-anchor="middle" font-size="9" font-weight="600" fill="#37474F">-V</text>
    <circle cx="155" cy="42" r="4" fill="#37474F"/>
    <text x="155" y="53" text-anchor="middle" font-size="9" font-weight="600" fill="#C62828">+V</text>
  </g>

  <!-- =============================== -->
  <!-- SAFETY / WARNING BOXES          -->
  <!-- =============================== -->

  <!-- 230V danger zone -->
  <g transform="translate(55, 100)">
    <rect x="0" y="0" width="240" height="20" rx="3" fill="#FFCDD2" stroke="#C62828" stroke-width="1"/>
    <text x="120" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#C62828">&#x26A0; 230V AC DANGER ZONE &#x26A0;</text>
  </g>

  <!-- 5V safe zone -->
  <g transform="translate(815, 100)">
    <rect x="0" y="0" width="240" height="20" rx="3" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1"/>
    <text x="120" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#2E7D32">5V DC SAFE ZONE</text>
  </g>

  <!-- =============================== -->
  <!-- WIRE GAUGE LABELS               -->
  <!-- =============================== -->
  <text x="300" y="165" font-size="8" fill="#aaa">0.5mm&#178; stranded</text>
  <text x="670" y="310" font-size="8" fill="#aaa">USB 28AWG</text>

  <!-- =============================== -->
  <!-- LEGEND                          -->
  <!-- =============================== -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="310" height="140" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <text x="155" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#333">LEGEND</text>

    <line x1="15" y1="35" x2="50" y2="35" stroke="#8B4513" stroke-width="2.5"/>
    <text x="58" y="39" font-size="9" fill="#333">L (fasi) - 230V AC Live</text>

    <line x1="15" y1="53" x2="50" y2="53" stroke="#2980b9" stroke-width="2.5"/>
    <text x="58" y="57" font-size="9" fill="#333">N (oudeteros) - Neutral</text>

    <line x1="15" y1="71" x2="50" y2="71" stroke="#e74c3c" stroke-width="2.5"/>
    <text x="58" y="75" font-size="9" fill="#333">+5V DC (USB red wire)</text>

    <line x1="15" y1="89" x2="50" y2="89" stroke="#333" stroke-width="2.5"/>
    <text x="58" y="93" font-size="9" fill="#333">GND / -V DC (USB black wire)</text>

    <circle cx="32" cy="107" r="6" fill="none" stroke="#FF6F00" stroke-width="1.5"/>
    <circle cx="32" cy="107" r="2" fill="#FF6F00"/>
    <text x="58" y="111" font-size="9" fill="#333">Solder joint (apply heat shrink)</text>

    <rect x="15" y="121" width="30" height="8" rx="4" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="58" y="130" font-size="9" fill="#333">Enclosure boundary</text>
  </g>

  <!-- =============================== -->
  <!-- NOTES                           -->
  <!-- =============================== -->
  <g transform="translate(380, 520)">
    <rect x="0" y="0" width="690" height="140" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <text x="15" y="18" font-size="10" font-weight="700" fill="#333">NOTES</text>

    <text x="15" y="36" font-size="9" fill="#555">1. All 230V wiring must be done by a qualified electrician. Disconnect mains before any work.</text>
    <text x="15" y="50" font-size="9" fill="#555">2. The 1.6A fuse is specified by Smart Citizen project to handle IRM-10-5 inrush current.</text>
    <text x="15" y="64" font-size="9" fill="#555">3. Cut the USB-A end off the cable. Only red (+5V) and black (GND) wires are used. Tape off white/green data wires.</text>
    <text x="15" y="78" font-size="9" fill="#555">4. Apply heat shrink on ALL 4 solder joints before assembly. No exposed copper.</text>
    <text x="15" y="92" font-size="9" fill="#555">5. Cable gland (M12) seals the USB cable exit from junction box. Tighten to prevent strain.</text>
    <text x="15" y="106" font-size="9" fill="#555">6. Before connecting SCK: measure DC output with multimeter. Must read ~5.0V (&#177;2%).</text>
    <text x="15" y="120" font-size="9" fill="#555">7. The SCK LiPo battery acts as UPS. Always leave it connected for power-loss resilience.</text>
    <text x="15" y="134" font-size="9" fill="#555">8. Ref: docs.smartcitizen.me/hardware/addons/power-supply/</text>
  </g>

</svg>

<button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>
</body>
</html>
