services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://soundwatch:${POSTGRES_PASSWORD}@postgres:5432/soundwatch
      - MQTT_BROKER_URL=mqtt://mosquitto:1884
      - NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  mqtt-ingester:
    build:
      context: .
      dockerfile: Dockerfile.ingester
    environment:
      - DATABASE_URL=postgresql://soundwatch:${POSTGRES_PASSWORD}@postgres:5432/soundwatch
      - MQTT_BROKER_URL=mqtt://mosquitto:1884
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  mosquitto:
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    ports:
      # Only the device listener is published. 1884 (backend) stays internal to
      # the compose network on purpose — see mosquitto/mosquitto.conf.
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  postgres:
    # TimescaleDB, drop-in for postgres:17 (same data dir).
    image: timescale/timescaledb:latest-pg17
    # The extension cannot load without a preload entry, and the entry is NOT
    # implied by the image. timescaledb-tune writes it into postgresql.conf at
    # initdb — on FIRST initialization only. Production's pgdata was created
    # before this image was adopted, so its conf still reads
    # `#shared_preload_libraries = ''` and `SHOW shared_preload_libraries`
    # returns empty. Locally the volume was created fresh, so it was tuned and
    # everything worked: the two environments were identical in configuration
    # and different in history, which is the worst way for a difference to hide.
    #
    # Without this, `CREATE EXTENSION timescaledb` in migration 0016 fails, the
    # migration transaction rolls back, `prisma migrate deploy` exits non-zero
    # and the container does not start.
    #
    # Declaring it here makes it true regardless of how the volume was born.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_USER: soundwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soundwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundwatch"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  mosquitto_data:
