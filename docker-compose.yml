services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://soundwatch:${POSTGRES_PASSWORD}@postgres:5432/soundwatch
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  mqtt-ingester:
    build:
      context: .
      dockerfile: Dockerfile.ingester
    environment:
      - DATABASE_URL=postgresql://soundwatch:${POSTGRES_PASSWORD}@postgres:5432/soundwatch
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  sc-poller:
    build:
      context: .
      dockerfile: Dockerfile.sc-poller
    environment:
      - DATABASE_URL=postgresql://soundwatch:${POSTGRES_PASSWORD}@postgres:5432/soundwatch
      - SC_DEVICES=${SC_DEVICES}
      - POLL_INTERVAL_S=${POLL_INTERVAL_S:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mosquitto:
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTTS_PORT:-8883}:8883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
    restart: unless-stopped

  postgres:
    # TimescaleDB-capable, drop-in for postgres:17 (same data dir). PLAIN usage
    # for now — no hypertables/continuous aggregates yet (Step 6). Forward-compat
    # so Step 6 needs no DB migration/move. Pin a concrete version for prod.
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: soundwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soundwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundwatch"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  mosquitto_data:
